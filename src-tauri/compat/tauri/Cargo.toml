[package]
name = "tauri"
version = "0.0.0"
edition = "2021"
publish = false
description = "The slice of Tauri's command, state, and event API Fabricator's local server implements."

[dependencies]
base64 = "0.22"
inventory = "0.3"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-macros = { path = "../tauri-macros" }
tokio = { version = "1", features = ["rt", "sync", "macros"] }
url = "2"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
