[package]
name = "rayfin-fabricator"
version = "1.54.0"
description = "Fabricator — a desktop app for building Rayfin apps via chat, wrapping the GitHub Copilot CLI and the Rayfin CLI."
authors = ["Fabricator"]
license = "MIT"
repository = "https://github.com/spatney/rayfin-fabricator"
edition = "2021"
# Bumped from 1.77.2 for github-copilot-sdk, which requires Rust >= 1.94 (it is an
# edition-2024 crate). This crate stays edition 2021; only the toolchain must be >= 1.94.
rust-version = "1.94"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
path = "src/lib.rs"

[[bin]]
name = "fabricator"
path = "src/main.rs"

[build-dependencies]

[dependencies]
# Local compatibility layer: the command, state, and event types the handlers
# were written against, backed by the browser instead of a system webview.
tauri = { path = "compat/tauri" }
tauri-plugin-dialog = { path = "compat/tauri-plugin-dialog" }
tauri-plugin-opener = { path = "compat/tauri-plugin-opener" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
log = "0.4"

tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time", "net", "signal", "fs"] }
futures = "0.3"
axum = { version = "0.8", features = ["ws", "multipart", "json"] }
tower = "0.5"
rust-embed = "8"
mime_guess = "2"
inventory = "0.3"
async-trait = "0.1"

# GitHub Copilot CLI, driven via JSON-RPC instead of the old one-shot `copilot -p`
# exec path. The default `bundled-cli` feature embeds a version-pinned Copilot CLI
# at build time (downloaded by its build.rs) and self-extracts it to
# %LOCALAPPDATA%\github-copilot-sdk\cli\<ver>\copilot.exe at runtime, so the app is
# self-contained (no separate install). Build requires network; cache via
# BUNDLED_CLI_CACHE_DIR in CI.
github-copilot-sdk = "1.0.20"

uuid = { version = "1", features = ["v4"] }
sha2 = "0.11"
hex = "0.4"
base64 = "0.23"
regex = "1"
once_cell = "1"
# npm version ranges: the Rayfin release new projects start on (services/rayfin_sdk.rs).
semver = "1"
chrono = { version = "0.4", features = ["clock"], default-features = false }

# native-tls: the OS TLS stack and trust store (SChannel / Security.framework), the same one
# the Copilot SDK's reqwest already uses in this process, so corporate root CAs are trusted.
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "json", "stream"] }

# The local relay for a model provider whose API rejects fields the Copilot runtime sends
# (services/byok/relay.rs). The same hyper stack reqwest already uses.
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"

dirs = "7"
which = "8"
trash = "5"
thiserror = "2"
anyhow = "1"

# Extract user-uploaded custom-skill `.zip` bundles (see commands/custom_skills.rs).
# `enclosed_name()` is used on entries to guard against zip-slip path traversal.
zip = { version = "9", default-features = false, features = ["deflate"] }
# Decode an installed app's icon (services/apps).
png = "0.18"
# The project terminal's pseudoterminals (services/terminal): ConPTY on Windows, a Unix PTY
# on macOS. WezTerm's own PTY layer.
portable-pty = "0.9"

# Windows shell shortcuts for an installed app (services/apps/shell.rs) and the
# credential and process APIs the rest of the backend already uses.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Wdk_System_Threading",
  "Win32_Foundation",
  "Win32_NetworkManagement_IpHelper",
  "Win32_Security_Credentials",
  "Win32_Storage_EnhancedStorage",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Memory",
  "Win32_System_ProcessStatus",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_UI_Shell",
  "Win32_UI_Shell_PropertiesSystem",
] }

# Keychain storage for the user's own model provider API keys (services/byok).
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
