# Releases are published by ci.yml when a v* tag is pushed: that workflow builds
# fabricator.exe (and the Linux and macOS binaries) and attaches them to the
# GitHub Release. This file stays so older links to the release workflow name
# still resolve; it does not build an installer.
name: Release

on:
  workflow_dispatch:

jobs:
  note:
    name: Releases are built by CI
    runs-on: ubuntu-latest
    steps:
      - name: Explain
        run: echo "Push a v* tag. .github/workflows/ci.yml builds fabricator and attaches it to the GitHub Release."
